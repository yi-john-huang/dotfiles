# Prefix and basics
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g focus-events on
set -s escape-time 10
set -g history-limit 100000
set -g detach-on-destroy off
set -g set-clipboard on

# Windows and panes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on

set -g mouse on
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour81"
set -g display-panes-colour colour238
set -g display-panes-active-colour colour81

# Status line
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=colour235,fg=colour250"
set -g status-left-length 40
set -g status-right-length 100
set -g status-left "#[fg=colour81,bold]#S #[fg=colour244]| "
set -g status-right "#[fg=colour244]%Y-%m-%d #[fg=colour81]%H:%M"
setw -g window-status-current-style "fg=colour235,bg=colour81,bold"
setw -g window-status-current-format " #I:#W#{?window_zoomed_flag,*,} "
setw -g window-status-style "fg=colour250,bg=colour235"
setw -g window-status-format " #I:#W#{?window_flags,#{window_flags},} "

# Splits and navigation
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind z resize-pane -Z

bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Copy mode
setw -g mode-keys vi
bind [ copy-mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send -X cancel

# Local machine overrides
if-shell "[ -f ~/.tmux.local ]" "source-file ~/.tmux.local"
